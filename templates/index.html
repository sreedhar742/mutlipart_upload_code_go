<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Encoder</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            color-scheme: light;
            --bg: #f6f7f9;
            --panel: #ffffff;
            --panel-soft: #f0f4f8;
            --text: #18212f;
            --muted: #667085;
            --line: #d8dee8;
            --accent: #0f766e;
            --accent-strong: #115e59;
            --danger: #b42318;
            --success: #047857;
            --shadow: 0 16px 40px rgba(28, 39, 58, 0.10);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", "Helvetica Neue", sans-serif;
            color: var(--text);
            background:
                linear-gradient(135deg, rgba(15, 118, 110, 0.12), transparent 38%),
                linear-gradient(180deg, #f8fafc 0%, var(--bg) 100%);
            padding: 24px;
        }

        .shell {
            width: min(1180px, 100%);
            margin: 0 auto;
            display: grid;
            gap: 20px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            align-items: center;
            padding: 8px 0;
        }

        h1, h2, h3, p {
            margin-top: 0;
        }

        h1 {
            margin-bottom: 4px;
            font-size: 2rem;
            letter-spacing: 0;
        }

        h2 {
            margin-bottom: 14px;
            font-size: 1.15rem;
        }

        p {
            color: var(--muted);
            line-height: 1.5;
        }

        .grid {
            display: grid;
            grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr);
            gap: 20px;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: var(--shadow);
            padding: 20px;
        }

        .upload-box {
            display: grid;
            gap: 14px;
            padding: 16px;
            border: 1px dashed #a7b4c5;
            border-radius: 8px;
            background: var(--panel-soft);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }

        input[type="file"] {
            max-width: 100%;
            color: var(--muted);
        }

        button {
            border: 0;
            border-radius: 6px;
            padding: 10px 14px;
            font-weight: 700;
            cursor: pointer;
        }

        button:disabled {
            cursor: wait;
            opacity: 0.65;
        }

        .primary {
            background: var(--accent);
            color: white;
        }

        .secondary {
            background: #e6ebf2;
            color: var(--text);
        }

        progress {
            width: 100%;
            height: 12px;
            border: 0;
            border-radius: 999px;
            overflow: hidden;
            appearance: none;
        }

        progress::-webkit-progress-bar {
            background: #dce3ec;
        }

        progress::-webkit-progress-value {
            background: var(--accent);
        }

        progress::-moz-progress-bar {
            background: var(--accent);
        }

        .status {
            min-height: 22px;
            font-weight: 700;
        }

        .error {
            color: var(--danger);
        }

        .success {
            color: var(--success);
        }

        .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .meta span,
        .badge {
            padding: 4px 8px;
            border-radius: 999px;
            background: #e7edf4;
        }

        video {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #0b1220;
            border-radius: 8px;
        }

        .video-list {
            display: grid;
            gap: 12px;
        }

        .video-card {
            display: grid;
            grid-template-columns: 120px minmax(0, 1fr) auto;
            gap: 14px;
            align-items: center;
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #fff;
        }

        .thumb {
            width: 120px;
            aspect-ratio: 16 / 9;
            border-radius: 6px;
            background: #dce3ec;
            object-fit: cover;
        }

        .video-title {
            margin: 0 0 8px;
            font-weight: 800;
            word-break: break-word;
        }

        .empty {
            padding: 18px;
            color: var(--muted);
            border: 1px dashed var(--line);
            border-radius: 8px;
            text-align: center;
        }

        @media (max-width: 840px) {
            body {
                padding: 14px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .topbar,
            .video-card {
                align-items: stretch;
                grid-template-columns: 1fr;
            }

            .thumb {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <main class="shell">
        <header class="topbar">
            <div>
                <h1>Video Encoder</h1>
                <p>Upload videos to Spaces, process them with FFmpeg, and play the generated HLS stream.</p>
            </div>
            <button id="refreshButton" class="secondary" type="button">Refresh</button>
        </header>

        <section class="grid">
            <div class="panel">
                <h2>Upload video</h2>
                <div class="upload-box">
                    <div class="actions">
                        <input id="file" type="file" accept="video/*">
                        <button id="uploadButton" class="primary" type="button">Upload and encode</button>
                    </div>
                    <progress id="uploadProgress" value="0" max="100"></progress>
                    <progress id="encodeProgress" value="0" max="100"></progress>
                    <div id="status" class="status"></div>
                    <div id="meta" class="meta"></div>
                </div>
            </div>

            <div class="panel">
                <h2>Player</h2>
                <video id="player" controls></video>
                <p id="playerStatus">Select a completed video to play.</p>
            </div>
        </section>

        <section class="panel">
            <h2>Videos</h2>
            <div id="videoList" class="video-list"></div>
        </section>
    </main>

    <script>
        const chunkSize = 5 * 1024 * 1024;
        const maxParallelUploads = 4;
        const fileInput = document.getElementById("file");
        const uploadButton = document.getElementById("uploadButton");
        const refreshButton = document.getElementById("refreshButton");
        const uploadProgress = document.getElementById("uploadProgress");
        const encodeProgress = document.getElementById("encodeProgress");
        const statusNode = document.getElementById("status");
        const metaNode = document.getElementById("meta");
        const videoList = document.getElementById("videoList");
        const player = document.getElementById("player");
        const playerStatus = document.getElementById("playerStatus");
        let hls;

        function formatBytes(bytes) {
            if (!bytes) return "0 B";
            const units = ["B", "KB", "MB", "GB", "TB"];
            let size = bytes;
            let unitIndex = 0;
            while (size >= 1024 && unitIndex < units.length - 1) {
                size /= 1024;
                unitIndex++;
            }
            return `${size.toFixed(size >= 10 || unitIndex === 0 ? 0 : 1)} ${units[unitIndex]}`;
        }

        function setStatus(message, type = "") {
            statusNode.textContent = message;
            statusNode.className = `status ${type}`.trim();
        }

        function setMeta(items = []) {
            metaNode.innerHTML = items.map((item) => `<span>${item}</span>`).join("");
        }

        async function fetchJSON(url, options) {
            const response = await fetch(url, options);
            if (!response.ok) {
                const message = await response.text();
                throw new Error(message || "Request failed");
            }
            return response.json();
        }

        async function uploadPart(file, key, uploadId, partNumber) {
            const start = (partNumber - 1) * chunkSize;
            const chunk = file.slice(start, start + chunkSize);
            const { url } = await fetchJSON(`/videos/uploads/part-url?key=${encodeURIComponent(key)}&uploadId=${encodeURIComponent(uploadId)}&partNumber=${partNumber}`);
            const uploadResponse = await fetch(url, { method: "PUT", body: chunk });
            if (!uploadResponse.ok) throw new Error(`Part ${partNumber} upload failed`);

            const etag = uploadResponse.headers.get("ETag") || uploadResponse.headers.get("etag");
            if (!etag) throw new Error("ETag missing. Configure Spaces CORS to expose the ETag header.");
            return { ETag: etag.replace(/"/g, ""), PartNumber: partNumber };
        }

        async function uploadPartsInParallel(file, key, uploadId, totalParts) {
            const parts = new Array(totalParts);
            let nextPart = 1;
            let uploadedParts = 0;
            const workerCount = Math.min(maxParallelUploads, totalParts);

            async function worker() {
                while (nextPart <= totalParts) {
                    const partNumber = nextPart++;
                    parts[partNumber - 1] = await uploadPart(file, key, uploadId, partNumber);
                    uploadedParts++;
                    uploadProgress.value = Math.round((uploadedParts / totalParts) * 100);
                    setStatus(`Uploaded ${uploadedParts} of ${totalParts} parts.`, "");
                }
            }

            await Promise.all(Array.from({ length: workerCount }, worker));
            return parts;
        }

        async function uploadVideo() {
            const file = fileInput.files[0];
            if (!file) {
                setStatus("Select a video first.", "error");
                return;
            }

            uploadButton.disabled = true;
            uploadProgress.value = 0;
            encodeProgress.value = 0;
            const totalParts = Math.max(1, Math.ceil(file.size / chunkSize));
            setStatus("Starting upload...", "");
            setMeta([file.name, formatBytes(file.size), `${totalParts} parts`, `${Math.min(totalParts, maxParallelUploads)} parallel`]);

            try {
                const start = await fetchJSON(`/videos/uploads/start?filename=${encodeURIComponent(file.name)}&size=${file.size}`);
                const parts = await uploadPartsInParallel(file, start.key, start.uploadId, totalParts);

                setStatus("Finalizing upload and creating encoding job...", "");
                const complete = await fetchJSON("/videos/uploads/complete", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        videoId: start.videoId,
                        filename: file.name,
                        key: start.key,
                        uploadId: start.uploadId,
                        size: file.size,
                        parts
                    })
                });

                await pollJob(complete.jobId);
                await loadVideos();
            } catch (error) {
                setStatus(error.message || "Upload failed", "error");
            } finally {
                uploadButton.disabled = false;
            }
        }

        async function pollJob(jobId) {
            while (true) {
                const job = await fetchJSON(`/jobs/${jobId}`);
                encodeProgress.value = job.progress || 0;
                setStatus(`Encoding ${job.progress || 0}% (${job.status})`, job.status === "failed" ? "error" : "");

                if (job.status === "completed") {
                    setStatus("Encoding completed.", "success");
                    return;
                }
                if (job.status === "failed") {
                    throw new Error(job.error || "Encoding failed");
                }
                await new Promise((resolve) => setTimeout(resolve, 2000));
            }
        }

        async function loadVideos() {
            const videos = await fetchJSON("/videos");
            if (!videos.length) {
                videoList.innerHTML = `<div class="empty">No videos uploaded yet.</div>`;
                return;
            }

            videoList.innerHTML = videos.map((video) => `
                <article class="video-card">
                    ${video.thumbnailUrl ? `<img class="thumb" src="${video.thumbnailUrl}" alt="">` : `<div class="thumb"></div>`}
                    <div>
                        <h3 class="video-title">${video.filename}</h3>
                        <div class="meta">
                            <span>${formatBytes(video.size)}</span>
                            <span>${video.status}</span>
                            ${video.error ? `<span>${video.error}</span>` : ""}
                        </div>
                    </div>
                    <button class="primary" type="button" data-playlist="${video.playlistUrl || ""}" ${video.playlistUrl ? "" : "disabled"}>Play</button>
                </article>
            `).join("");
        }

        function playVideo(url) {
            if (!url) return;
            if (hls) {
                hls.destroy();
                hls = null;
            }

            if (player.canPlayType("application/vnd.apple.mpegurl")) {
                player.src = url;
            } else if (window.Hls && Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(player);
            } else {
                playerStatus.textContent = "This browser cannot play HLS.";
                return;
            }
            playerStatus.textContent = "Loaded HLS stream.";
            player.play().catch(() => {});
        }

        uploadButton.addEventListener("click", uploadVideo);
        refreshButton.addEventListener("click", loadVideos);
        videoList.addEventListener("click", (event) => {
            const button = event.target.closest("button[data-playlist]");
            if (!button) return;
            playVideo(button.dataset.playlist);
        });

        loadVideos().catch((error) => {
            videoList.innerHTML = `<div class="empty">Failed to load videos: ${error.message}</div>`;
        });
    </script>
</body>
</html>
